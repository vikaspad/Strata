<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trade Blotter</title>
  <script src="/blotter.js" defer></script>
</head>
<body>
<nav id="main-nav" aria-label="Main">
  <a href="/blotter/48213">Blotter</a>
  <a href="/reports">Reports</a>
  <a href="/login">Log out</a>
</nav>
<main>
  <h1>Blotter 99001</h1>
  <form id="blotter-filter">
    <label for="mat-input-12">Trade date</label>
    <input id="mat-input-12" type="date" value="2026-11-05">
    <label for="ps-9120">Account</label>
    <select id="ps-9120" name="account">
      <option value="ACC-9">ACC-9 Oakridge Pension Fund</option>
    </select>
    <input type="text" name="counterparty" placeholder="Counterparty">
    <textarea name="notes"></textarea>
    <button type="button" aria-label="Apply filters">Apply</button>
    <button type="reset">Reset</button>
  </form>

  <div role="tablist">
    <button role="tab" id="tab-open" aria-selected="true">Open</button>
    <button role="tab" id="tab-settled">Settled</button>
  </div>

  <section data-testid="trade-grid">
    <h2>Trades</h2>
    <button type="button" aria-label="Export">Export</button>
    <table id="trades">
      <thead>
      <tr><th>Trade</th><th>Client</th><th>Notional</th><th></th></tr>
      </thead>
      <tbody>
      <tr id="row-99001-1"><td>T-7781</td><td>Oakridge Pension Fund</td><td>9,800,000</td><td><button type="button">View</button></td></tr>
      </tbody>
    </table>
  </section>

  <section id="allocations">
    <h2>Allocations</h2>
    <label for="alloc-qty">Quantity</label>
    <input id="alloc-qty" type="number" value="500">
    <button type="button">Allocate</button>
  </section>
</main>
</body>
</html>
